<!-- Vertical Tab Strip Component - extends BaseToolbarComponent -->
<div [ngClass]="getToolbarClasses()" [ngStyle]="getToolbarStyles()" *ngIf="visible" [attr.data-toolbar-type]="toolbarId"
    class="vertical-tab-strip-panel">

    <!-- Toolbar Header (from BaseToolbarComponent) -->
    <div [ngClass]="getHeaderClasses()" (mousedown)="onDragStart($event)">
        <h3>
            <span class="toolbar-icon">{{ toolbarIcon }}</span>
            {{ toolbarTitle }}
        </h3>
        <div class="header-actions">
            <button class="help-toggle" (click)="onToggleHelp()" title="Show help">
                ❓
            </button>
            <button class="orientation-toggle" (click)="toggleTextOrientation()"
                [title]="textOrientation === 'vertical' ? 'Switch to Horizontal' : 'Switch to Vertical'">
                {{ textOrientation === 'vertical' ? '↕️' : '↔️' }}
            </button>
            <button class="expand-toggle" (click)="onToggleExpanded()" [title]="getExpandButtonTitle()">
                {{ expanded ? '🔼' : '🔽' }}
            </button>
            <button class="close-button" (click)="onClose(); $event.stopPropagation()"
                (mousedown)="$event.stopPropagation()" title="Close toolbar">
                ✖️
            </button>
            <button class="lock-toggle" (click)="onToggleLock(); $event.stopPropagation()"
                (mousedown)="$event.stopPropagation()" [title]="getLockButtonTitle()">
                {{ locked ? '🔒' : '🔓' }}
            </button>
            <span class="drag-icon" (mousedown)="onDragStart($event)">⋮⋮</span>
        </div>
    </div>

    <!-- Help Overlay -->
    <app-help-overlay *ngIf="showHelpOverlay" [helpText]="toolbarHelp" (close)="onCloseHelp()"></app-help-overlay>

    <!-- Main Content: Tab Strip + Tab Content -->
    <div class="tab-container" *ngIf="expanded">
        <!-- Vertical Tab Strip (sticks out from the side) -->
        <div [ngClass]="getTabStripClasses()" [style.--tab-width]="tabWidth + 'px'">
            <button *ngFor="let tab of tabs" [ngClass]="getTabClasses(tab)" (click)="selectTab(tab.id)"
                [disabled]="tab.disabled" [title]="tab.label">
                <!-- Icon and Label -->
                <span class="tab-content-wrapper">
                    <span class="tab-icon" *ngIf="tab.icon">{{ tab.icon }}</span>
                    <span class="tab-label" [style.transform]="getTextRotation()">{{ tab.label }}</span>
                </span>
            </button>
        </div>

        <!-- Tab Content Area -->
        <div class="tab-content-area" [ngClass]="'strip-' + stripPosition">
            <div class="tab-content" *ngIf="getSelectedTab() as selectedTab" [attr.data-tab-id]="selectedTab.id">
                <!-- Generic Template Content -->
                <ng-container *ngIf="selectedTab.content">
                    <ng-container *ngTemplateOutlet="selectedTab.content"></ng-container>
                </ng-container>
                <!-- Default Content -->
                <div *ngIf="!selectedTab.content" class="default-content">
                    <h4>{{ selectedTab.label }}</h4>
                    <p>{{ selectedTab.icon }} Content for {{ selectedTab.label }} goes here</p>
                    <p>Supply a custom template via the 'content' property in the TabConfig to replace this.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Vertical Resize Handle (from BaseToolbarComponent) -->
    <div class="resize-handle" *ngIf="resizable" (mousedown)="onResizeStart($event)" title="Drag to resize vertically">
        <div class="resize-grip"></div>
    </div>
</div>
