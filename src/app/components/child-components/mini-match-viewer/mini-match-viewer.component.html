<div class="gsap-soccer-container" [class.light-mode]="!isDarkMode" [class.dark-mode]="isDarkMode">
    <!-- Main Content Area -->
    <div class="main-content">
        <!-- Field Panel with Controls Below -->
        <div class="field-panel">
            <!-- Soccer Field -->
            <div class="field-container">
                <svg #svgContainer [attr.width]="fieldWidth + fieldPadding * 2"
                    [attr.height]="fieldHeight + fieldPadding * 2"
                    [attr.viewBox]="'0 0 ' + (fieldWidth + fieldPadding * 2) + ' ' + (fieldHeight + fieldPadding * 2)">
                    <defs>
                        <pattern id="grass-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
                            <rect width="100" height="100" fill="#2ECC71" />
                            <rect width="100" height="100" fill="#27AE60" opacity="0.3" />
                        </pattern>
                        <pattern id="grid-pattern" x="0" y="0" [attr.width]="gridSize" [attr.height]="gridSize"
                            patternUnits="userSpaceOnUse">
                            <path [attr.d]="'M ' + gridSize + ' 0 L 0 0 0 ' + gridSize" fill="none"
                                stroke="rgba(255,255,255,0.2)" stroke-width="1" />
                        </pattern>
                    </defs>
                    <g [attr.transform]="'translate(' + fieldPadding + ',' + fieldPadding + ')'">
                        <image [attr.href]="getFieldGridPath()" x="0" y="0" [attr.width]="fieldWidth"
                            [attr.height]="fieldHeight" preserveAspectRatio="none" />
                        <rect *ngIf="showGrid" x="0" y="0" [attr.width]="fieldWidth" [attr.height]="fieldHeight"
                            fill="url(#grid-pattern)" />
                        <g id="soccer-ball" [attr.transform]="getBallTransform()" class="ball-group">
                            <circle r="11" fill="#fff" stroke="#333" stroke-width="1" />
                            <polygon points="0,-8 4.8,-2.4 3,-6.8 -3,-6.8 -4.8,-2.4" fill="#000" />
                            <polygon points="-6,-4 -3,-6 0,-4.5 0,-1.5 -3,-3 -6,-1.5" fill="#000" />
                            <polygon points="6,-4 3,-6 0,-4.5 0,-1.5 3,-3 6,-1.5" fill="#000" />
                            <polygon points="-6,4 -4.8,2.4 -3,6.8 3,6.8 0,3" fill="#000" />
                            <polygon points="6,4 4.8,2.4 3,6.8 -3,6.8 0,3" fill="#000" />
                            <polygon points="-3,-1 0,-2 3,-1 3,1 0,2 -3,1" fill="#000" />
                            <circle r="11" fill="none" stroke="#000" stroke-width="0.5" opacity="0.2" />
                        </g>
                        <g *ngFor="let player of players" [attr.id]="player.id"
                            [attr.transform]="getPlayerTransform(player)" class="player-group">
                            <circle r="15" [attr.fill]="player.color" stroke="#fff" stroke-width="2"
                                class="player-circle" />
                            <text text-anchor="middle" dy="5" class="player-number" fill="#fff" font-size="14"
                                font-weight="bold">{{ player.number }}</text>
                        </g>
                    </g>
                </svg>
            </div>

            <!-- Playback Controls Below Field -->
            <div class="playback-controls">
                <div class="vcr-buttons">
                    <button (click)="rewind()" [disabled]="isPlaying" class="vcr-btn"
                        title="Rewind to start">⏮️</button>
                    <button (click)="play()" [disabled]="isPlaying || currentSequence.keyframes.length < 2"
                        class="vcr-btn vcr-play" title="Play">▶️</button>
                    <button (click)="pause()" [disabled]="!isPlaying" class="vcr-btn" title="Pause">⏸️</button>
                    <button (click)="stop()" [disabled]="!isPlaying && currentTime === 0" class="vcr-btn"
                        title="Stop">⏹️</button>
                    <button (click)="end()" [disabled]="isPlaying" class="vcr-btn"
                        title="Jump to last keyframe">⏭️</button>
                    <button (click)="repeatMode = !repeatMode" [class.active]="repeatMode" class="vcr-btn repeat-btn"
                        title="Toggle repeat mode">🔁</button>
                </div>
            </div>
        </div>
    </div>
</div>
