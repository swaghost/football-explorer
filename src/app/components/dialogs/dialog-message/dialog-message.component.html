<app-base-dialog [visible]="visible" (close)="onClose()">
    <div class="dialog-message-content">
        <div class="message-icon">{{ icon }}</div>
        <h2>{{ title }}</h2>
        <p>{{ message }}</p>
        <div class="dialog-actions">
            <button class="btn btn-primary" (click)="onClose()">OK</button>
        </div>
    </div>
</app-base-dialog>
