<div class="full-window-container" [class.dark-mode]="isDarkMode" [class.bottom-toolbar-visible]="bottomToolbarVisible">

    <!-- Static Top Toolbar for Toolbar Controls -->
    <div class="static-toolbar-controls">
        <!-- Tenant Logo -->
        <div class="tenant-logo-container">
            <img *ngIf="selectedTenant?.LogoUrl" [src]="selectedTenant.LogoUrl"
                [alt]="selectedTenant.TenantName + ' logo'" class="tenant-logo" [title]="selectedTenant.TenantName" />
            <img *ngIf="!selectedTenant?.LogoUrl" src="assets/images/mock-tenant-logos/TENANT.LOGO.SOCCR-ORG.png"
                alt="Default logo" class="tenant-logo" title="No organization selected" />
        </div>

        <!-- Login Drawer Toggle -->
        <button class="toolbar-toggle-btn" [class.active]="isLoginDrawerOpen" (click)="toggleLoginDrawer()"
            title="Mock Login">
            🔑
        </button>

        <!-- Tenancy (Hamburger Menu) -->
        <button class="toolbar-toggle-btn hamburger-menu-btn" [class.active]="isTenantDrawerOpen"
            (click)="toggleTenantDrawer()" title="Tenancy / Organization Selection">
            <span class="hamburger-icon">☰</span>
        </button>

        <!-- Player Selection Drawer Toggle -->
        <button class="toolbar-toggle-btn" [class.active]="isPlayerSelectionDrawerOpen"
            (click)="togglePlayerSelectionDrawer()" title="Player / Context User Selection">
            👤
        </button>

        <!-- Teams Drawer Toggle -->
        <button class="toolbar-toggle-btn" [class.active]="isTeamsDrawerOpen" (click)="toggleTeamsDrawer()"
            title="Teams">
            👨‍👩‍👧‍👦
        </button>

        <!-- Team Groups Drawer Toggle -->
        <button class="toolbar-toggle-btn" [class.active]="isTeamGroupsDrawerOpen" (click)="toggleTeamGroupsDrawer()"
            [disabled]="!selectedTeam" title="Team Groups">
            👥
        </button>

        <!-- Datasets Drawer Toggle -->
        <button class="toolbar-toggle-btn" [class.active]="isDatasetsDrawerOpen" (click)="toggleDatasetsDrawer()"
            title="Datasets">
            📊
        </button>

        <!-- Lesson Builder Drawer Toggle -->
        <button class="toolbar-toggle-btn" [class.active]="isLessonBuilderDrawerOpen"
            (click)="toggleLessonBuilderDrawer()" title="Lesson Builder">
            📚
        </button>

        <!-- Separator -->
        <div class="toolbar-controls-separator"></div>

        <!-- Left Side Toolbar Toggle Buttons with Custom Spacing -->
        <ng-container *ngFor="let toolbarKey of getLeftToolbarKeys(); let i = index">
            <!-- Spacer after selectionTools -->
            <!-- <div *ngIf="toolbarKey === 'lessons'" class="toolbar-controls-separator"></div> -->

            <!-- Spacer after skillsRadar -->
            <div *ngIf="toolbarKey === 'rotationControl'" class="toolbar-controls-separator"></div>

            <!-- Spacer after search (teams toolbar removed) -->
            <div *ngIf="toolbarKey === 'search'" class="toolbar-controls-separator"></div>

            <!-- Spacer before favorites/bookmarks -->
            <div *ngIf="toolbarKey === 'favorites'" class="toolbar-controls-separator"></div>

            <button class="toolbar-toggle-btn" [class.active]="getToolbarVisibility(toolbarKey)"
                (click)="toggleToolbarVisibility(toolbarKey, $event)" [title]="getToolbarDisplayName(toolbarKey)">
                <span class="toolbar-icon">{{ getToolbarIcon(toolbarKey) }}</span>
            </button>
        </ng-container>

        <!-- Spacer to push right toolbar toggles to the far right -->
        <div class="toolbar-spacer"></div>

        <!-- Right Side Toolbar Toggle Buttons (View, Viewport, Visualization, Tracking) -->
        <button *ngFor="let toolbarKey of getRightToolbarKeys()" class="toolbar-toggle-btn"
            [class.active]="getToolbarVisibility(toolbarKey)" (click)="toggleToolbarVisibility(toolbarKey, $event)"
            [title]="getToolbarDisplayName(toolbarKey)">
            <span class="toolbar-icon">{{ getToolbarIcon(toolbarKey) }}</span>
        </button>

        <!-- Separator -->
        <div class="toolbar-controls-separator"></div>

        <!-- Clear All Actions -->
        <button class="toolbar-action-btn clear-drawings-btn" [disabled]="isClearDrawingsDisabled"
            (click)="confirmClearAllDrawings()" title="Clear All Drawings">
            🗑️ Clear Drawings
        </button>
        <button class="toolbar-action-btn clear-selections-btn" [disabled]="isClearSelectionsDisabled"
            (click)="confirmClearAllSelections()" title="Clear All Selections">
            ❌ Clear Selections
        </button>

        <!-- Separator -->
        <div class="toolbar-controls-separator"></div>

        <!-- Theme Toggle -->
        <button class="toolbar-toggle-btn theme-toggle" (click)="toggleTheme()"
            [title]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
            {{ isDarkMode ? '☀️' : '🌙' }}
        </button>

        <!-- Separator -->
        <div class="toolbar-controls-separator"></div>

        <!-- Context Drawer Toggle -->
        <button class="toolbar-toggle-btn" [class.active]="isContextDrawerOpen" (click)="toggleContextDrawer()"
            title="Context">
            �
        </button>

        <!-- Assigned Lessons Drawer Toggle -->
        <button class="toolbar-toggle-btn" [class.active]="isAssignedLessonsDrawerOpen"
            (click)="toggleAssignedLessonsDrawer()" title="Assigned Lessons">
            📚
            <span *ngIf="overdueLessonsCount > 0" class="badge badge-danger">{{ overdueLessonsCount }}</span>
        </button>

        <!-- Subscription Drawer Toggle -->
        <button class="toolbar-toggle-btn subscription-btn" [class.active]="isSubscriptionDrawerOpen"
            (click)="toggleSubscriptionDrawer()" title="Subscription">
            💎
        </button>

        <!-- To-Do Drawer Toggle -->
        <button class="toolbar-toggle-btn to-do-btn" [class.active]="isToDoDrawerOpen" (click)="toggleToDoDrawer()"
            title="To-Do List">
            ✓
            <span *ngIf="nonClosedToDoCount > 0" class="badge badge-danger">{{ nonClosedToDoCount }}</span>
        </button>
    </div>

    <!-- Static Bottom Toolbar -->
    <div class="static-bottom-toolbar" [class.dark-mode]="isDarkMode" *ngIf="bottomToolbarVisible">
        <!-- Left side - Breadcrumb Navigation -->
        <div class="bottom-toolbar-left">
            <!-- Dynamic breadcrumb -->
            <div class="breadcrumb-container" *ngIf="breadcrumbPath.length > 0">
                <div class="breadcrumb-content" #breadcrumbContent>
                    <span *ngFor="let node of breadcrumbPath; let i = index; let last = last" class="breadcrumb-item"
                        (click)="onBreadcrumbClick(node, $event)" [title]="'Click to navigate to: ' + node.name">
                        {{ node.name }}
                        <span *ngIf="!last" class="breadcrumb-separator">›</span>
                    </span>
                </div>
            </div>
        </div>

        <!-- Center - Empty (operation modes moved to right) -->
        <div class="bottom-toolbar-center">
        </div>

        <!-- Right side - Operation Modes and Key State Indicators -->
        <div class="bottom-toolbar-right">
            <!-- Hide All Controls -->
            <button class="toolbar-toggle-btn" (click)="hideAllToolbars()" title="Hide All Toolbars">
                🙈
            </button>

            <!-- Separator -->
            <div class="bottom-toolbar-separator"></div>

            <!-- Operation Mode Buttons -->
            <div class="operation-mode-buttons" *ngIf="operationModeService.isInitialized()">
                <button *ngFor="let mode of operationModeService.availableModes()" class="operation-mode-btn"
                    [class.active]="isOperationModeActive(mode.id)" [title]="getOperationModeTooltip(mode.id)"
                    (click)="onOperationModeClick(mode.id)">
                    <span class="mode-icon">{{ mode.icon }}</span>
                    <span class="mode-name">{{ mode.name }}</span>
                </button>
            </div>

            <!-- Separator between operation modes and key indicators -->
            <div class="bottom-toolbar-separator"></div>

            <!-- Key State Indicators -->
            <div class="key-state-indicators">
                <button class="key-indicator-btn" [class.active]="keyStates.ctrl" title="Ctrl Key State">
                    <span class="key-label">Ctrl</span>
                </button>
                <button class="key-indicator-btn" [class.active]="keyStates.alt" title="Alt Key State">
                    <span class="key-label">Alt</span>
                </button>
                <button class="key-indicator-btn" [class.active]="keyStates.shift" title="Shift Key State">
                    <span class="key-label">Shift</span>
                </button>
                <!-- Debug Dropdown Button -->
                <button class="key-indicator-btn"
                    style="background: red; color: white; margin-left: 10px; font-weight: bold;"
                    (click)="debugDropdownValues()" title="Debug Dropdown Values">
                    <span class="key-label">DEBUG</span>
                </button>
            </div>
        </div>
    </div>

    <!-- SVG Container -->
    <svg #svg class="svg-container" [class.snagit-active]="snagitActive"></svg>

    <!-- Text Input Overlay -->
    <div class="text-input-overlay" *ngIf="textInputVisible" [style.left.px]="textInputPosition.x"
        [style.top.px]="textInputPosition.y">
        <div class="text-input-container" [style.font-size.px]="textFontSize" [style.color]="textColor"
            [style.font-family]="textFontFamily" [class.bold]="textBold" [class.italic]="textItalic"
            [class.strikethrough]="textStrikethrough" contenteditable="true" #textInput (blur)="onTextInputBlur()"
            (keydown.enter)="onTextInputEnter($event)" (keydown.escape)="onTextInputEscape()">
        </div>
    </div>

        [editTeamAgeGroupId]="editTeamAgeGroupId" (close)="closeEditTeamDialog()" (save)="saveTeamChanges()"
        (teamNameChange)="onEditTeamNameChange($event)" (teamOrganizationChange)="onEditTeamOrganizationChange($event)"
        (teamGenderChange)="onEditTeamGenderChange($event)" (teamAgeGroupChange)="onEditTeamAgeGroupChange($event)">
    </app-dialog-edit-team>

    <!-- Delete Team Confirmation Dialog -->
    <app-dialog-delete-team [visible]="showDeleteTeamDialog" [teamToDelete]="teamToDelete"
        (close)="closeDeleteTeamDialog()" (confirm)="confirmDeleteTeam()">
    </app-dialog-delete-team>

    <!-- Delete Team Group Confirmation Dialog -->
    <app-dialog-delete-team-group [visible]="showDeleteTeamGroupDialog" [teamGroupToDelete]="teamGroupToDelete"
        (close)="closeDeleteTeamGroupDialog()" (confirm)="confirmDeleteTeamGroup()">
    </app-dialog-delete-team-group>

    <!-- Auto-Build Info Dialog -->
    <app-confirmation-dialog [visible]="showAutoBuildInfoDialog" [title]="autoBuildInfoTitle"
        [message]="autoBuildInfoMessage" [confirmText]="'OK'" [cancelText]="''" (confirmed)="closeAutoBuildInfoDialog()"
        (closed)="closeAutoBuildInfoDialog()">
    </app-confirmation-dialog>

    <!-- Create Team Group Dialog -->
    <app-dialog-create-team-group [visible]="showCreateTeamGroupDialog" [newTeamGroupName]="newTeamGroupName"
        [selectedTeam]="selectedTeam" [playerSortBy]="playerSortBy" [playerSortOptions]="playerSortOptions"
        [newTeamGroupPlayerIds]="newTeamGroupPlayerIds" [matchingPositionAbbreviations]="newTeamGroupMatchingPositions"
        [matchingPositionNumbers]="newTeamGroupMatchingNumbers" (close)="closeCreateTeamGroupDialog()"
        (save)="saveNewTeamGroup()" (playerSortChange)="onPlayerSortChange($event)"
        (playerCheckboxChange)="onNewTeamGroupPlayerCheckboxChange($event)"
        (matchingPositionsChange)="onNewTeamGroupMatchingPositionsChange($event)"
        (matchingNumbersChange)="onNewTeamGroupMatchingNumbersChange($event)">
    </app-dialog-create-team-group>

    <!-- Add Default Team Groups Dialog -->
    <app-dialog-add-default-team-groups [visible]="showAddDefaultTeamGroupsDialog" [selectedTeam]="selectedTeam"
        [availableDefaultTeamGroups]="getAvailableDefaultTeamGroupsForTeam()"
        [areAllDefaultTeamGroupsSelected]="areAllDefaultTeamGroupsSelectedForAdd()"
        [selectedDefaultTeamGroupsToAdd]="selectedDefaultTeamGroupsToAdd" (close)="closeAddDefaultTeamGroupsDialog()"
        (save)="addSelectedDefaultTeamGroupsWithPlayers()"
        (toggleSelectAllDefaultTeamGroups)="toggleSelectAllDefaultTeamGroupsForAdd()"
        (toggleDefaultTeamGroupSelection)="toggleDefaultTeamGroupSelectionForAdd($event)">
    </app-dialog-add-default-team-groups>

    <!-- Edit Lesson Dialog -->
    <app-dialog-edit-lesson [visible]="showEditLessonDialog" [editLessonName]="editLessonName"
        [editLessonDescription]="editLessonDescription" [editLessonChips]="editLessonChips"
        (close)="closeEditLessonDialog()" (save)="saveEditedLesson($event)">
    </app-dialog-edit-lesson>

    <!-- Create Lesson Dialog -->
    <app-dialog-create-lesson [visible]="showCreateLessonDialog" [newLessonName]="newLessonName"
        [selectedNodesCount]="selectedNodes.length" [currentUserRoleId]="currentUserRoleId"
        [selectedTenantId]="currentSelectedTenantId" [selectedTeamId]="currentSelectedTeamId"
        [selectedTenantName]="selectedTenant?.TenantName || null" [selectedTeamName]="selectedTeam?.TeamName || null"
        (close)="closeCreateLessonDialog()" (save)="saveNewLesson($event)"
        (newLessonNameChange)="newLessonName = $event">
    </app-dialog-create-lesson>

    <!-- Create Dataset Dialog -->
    <app-dialog-create-dataset [visible]="showCreateDatasetDialog" [organizations]="organizations"
        [selectedTenantId]="currentSelectedTenantId" [selectedTeamId]="currentSelectedTeamId"
        [selectedTeamName]="selectedTeam?.TeamName || null" [selectedTenantName]="selectedTenant?.TenantName || null"
        [currentUserRoleId]="currentUserRoleId" (close)="closeCreateDatasetDialog()"
        (create)="createNewDataset($event)">
    </app-dialog-create-dataset>

    <!-- Add Child Dialog -->
    <app-dialog-add-child [visible]="showAddChildDialog" [isDarkMode]="isDarkMode" [parentNodeId]="selectedNode"
        (confirm)="onAddChildConfirm($event)" (cancel)="closeAddChildDialog()">
    </app-dialog-add-child>

    <!-- Reparent Node Dialog -->
    <app-dialog-reparent-node [visible]="showReparentNodeDialog" [isDarkMode]="isDarkMode"
        [selectedNodeId]="selectedNode" [treeData]="treeData" (confirm)="onReparentNodeConfirm($event)"
        (cancel)="closeReparentNodeDialog()">
    </app-dialog-reparent-node>

    <!-- Nodes List Toolbar (Component) -->
    <app-toolbar-nodes-list [visible]="toolbarVisibility.nodesList" [isDarkMode]="isDarkMode"
        [position]="toolbarPositions.nodesList" [locked]="toolbarLocks.nodesList"
        [applyConstraints]="applyToolbarConstraints" [currentNodesList]="currentNodesList"
        [selectedNodes]="selectedNodes" [selectedNode]="selectedNode" [followSelectedNode]="nodeListFollowEnabled"
        (close)="hideToolbar('nodesList')" (toggleLock)="toggleToolbarLock('nodesList')"
        (dragStart)="onToolbarDragStart($event, 'nodesList')"
        (nodeClick)="onNodeClickFromList($event.node, $event.event)">
    </app-toolbar-nodes-list>

    <!-- Clear Children Confirmation Dialog -->
    <app-confirmation-dialog [visible]="showClearChildrenDialog" title="Clear Children"
        message="Are you sure you want to clear all of the children from the selected node?" confirmText="Clear"
        cancelText="Cancel" (confirmed)="onClearChildrenConfirmed($event)">
    </app-confirmation-dialog>

    <!-- Clear Drawings Confirmation Dialog -->
    <app-confirmation-dialog [visible]="showClearDrawingsDialog" title="Clear All Drawings"
        [message]="clearDrawingsMessage" confirmText="Clear All" cancelText="Cancel"
        (confirmed)="onClearDrawingsConfirmed($event)">
    </app-confirmation-dialog>

    <!-- Clear Selections Confirmation Dialog -->
    <app-confirmation-dialog [visible]="showClearSelectionsDialog" title="Clear All Selections"
        [message]="clearSelectionsMessage" confirmText="Clear All" cancelText="Cancel"
        (confirmed)="onClearSelectionsConfirmed($event)">
    </app-confirmation-dialog>

    <!-- System Default Warning Dialog -->
    <app-confirmation-dialog [visible]="showSystemDefaultWarningDialog" title="Cannot Edit System Default Group"
        message="System-level default team groups cannot be modified once they are created. These groups are protected to ensure consistency across all organizations and teams. You can create a copy as an organization or team-specific group instead."
        confirmText="OK" cancelText="" (confirmed)="onSystemDefaultWarningConfirmed($event)"
        (closed)="onSystemDefaultWarningConfirmed(false)">
    </app-confirmation-dialog>

    <!-- Promote Children Confirmation Dialog -->
    <app-confirmation-dialog [visible]="showPromoteChildrenDialog" title="Promote Children"
        message="Are you sure you want to make all of the children from the selected node into siblings of the selected node?"
        confirmText="Promote" cancelText="Cancel" (confirmed)="onPromoteChildrenConfirmed($event)">
    </app-confirmation-dialog>

    <!-- Delete Node Confirmation Dialog -->
    <app-confirmation-dialog [visible]="showDeleteNodeDialog" title="Delete Node" [message]="deleteConfirmationMessage"
        confirmText="Delete" cancelText="Cancel" (confirmed)="onDeleteNodeConfirmed($event)">
    </app-confirmation-dialog>

    <!-- Dataset Management Confirmation Dialogs -->
    <!-- Promote Dataset Confirmation Dialog -->
    <app-confirmation-dialog [visible]="showPromoteDatasetDialog" [title]="datasetConfirmationTitle"
        [message]="datasetConfirmationMessage" confirmText="Promote" cancelText="Cancel"
        (confirmed)="onPromoteDatasetConfirmed($event)">
    </app-confirmation-dialog>

    <!-- Demote Dataset Confirmation Dialog -->
    <app-confirmation-dialog [visible]="showDemoteDatasetDialog" [title]="datasetConfirmationTitle"
        [message]="datasetConfirmationMessage" confirmText="Demote" cancelText="Cancel"
        (confirmed)="onDemoteDatasetConfirmed($event)">
    </app-confirmation-dialog>

    <!-- Delete Dataset Confirmation Dialog -->
    <app-confirmation-dialog [visible]="showDeleteDatasetDialog" [title]="datasetConfirmationTitle"
        [message]="datasetConfirmationMessage" confirmText="Delete" cancelText="Cancel"
        (confirmed)="onDeleteDatasetConfirmed($event)">
    </app-confirmation-dialog>

    <!-- Dataset Info Dialog -->
    <app-confirmation-dialog [visible]="showDatasetInfoDialog" [title]="datasetInfoTitle" [message]="datasetInfoMessage"
        confirmText="OK" cancelText="" (confirmed)="onDatasetInfoDialogClosed()" (closed)="onDatasetInfoDialogClosed()">
    </app-confirmation-dialog>

    <!-- Apply Selection Without Lesson Confirmation Dialog -->
    <app-confirmation-dialog [visible]="showApplyNoLessonConfirmDialog" title="No Lesson Selected"
        message="There's no lesson selected. Do you want to create a new lesson?" confirmText="OK" cancelText="Cancel"
        (confirmed)="onApplyNoLessonConfirmed($event)">
    </app-confirmation-dialog>

    <!-- Lesson Management Confirmation Dialogs -->
    <!-- Delete Lesson Confirmation Dialog -->
    <app-confirmation-dialog [visible]="showDeleteLessonDialog" [title]="lessonConfirmationTitle"
        [message]="lessonConfirmationMessage" [confirmText]="lessonConfirmButtonText"
        [cancelText]="lessonCancelButtonText" (confirmed)="onDeleteLessonConfirmed($event)">
    </app-confirmation-dialog>

    <!-- Combine Datasets Dialog -->
    <app-dialog-combine-datasets [visible]="showCombineDatasetsDialog" [isDarkMode]="isDarkMode"
        [availableDatasets]="decisionFlows" [currentUserRoleId]="currentUserRoleId"
        [selectedTenantId]="currentSelectedTenantId" [selectedTeamId]="currentSelectedTeamId"
        (confirm)="onCombineDatasetsConfirmed($event)" (cancel)="onCombineDatasetsCancel()">
    </app-dialog-combine-datasets>

    <!-- Edit Dataset Dialog -->
    <app-dialog-edit-dataset [visible]="showEditDatasetDialog" [dataset]="editDatasetTarget"
        (save)="onEditDatasetConfirmed($event)" (cancel)="onEditDatasetCancel()">
    </app-dialog-edit-dataset>

    <!-- Insert Node Dialog -->
    <app-dialog-add-child [visible]="showInsertNodeDialog" title="Insert Node" confirmButtonText="Insert"
        (confirm)="onInsertNodeConfirm($event)" (cancel)="closeInsertNodeDialog()">
    </app-dialog-add-child>

    <!-- Edit Node Dialog -->
    <app-dialog-add-child [visible]="showEditNodeDialog" title="Edit Node" confirmButtonText="Save"
        [initialName]="editNodeFormData.name" [initialDescription]="editNodeFormData.description"
        (confirm)="onEditNodeConfirm($event)" (cancel)="closeEditNodeDialog()">
    </app-dialog-add-child>

    <!-- Black Background Layer for Auto-Fade Effects -->
    <div class="black-background" [style.display]="blackBackgroundVisible ? 'block' : 'none'"
        [class.dark-mode]="isDarkMode">
    </div>

    <!-- Black Background Layer (underneath logo) -->
    <div class="logo-black-background" [class.dark-mode]="isDarkMode"></div>

    <!-- Logo Fade Overlay -->
    <div class="logo-fade" [class.dark-mode]="isDarkMode">
        <img src="assets/images/logo.png" alt="Logo" class="logo-image"
            onload="console.log('Logo image loaded successfully');" />
    </div>

    <!-- Login Drawer -->
    <app-drawer-login [isOpen]="isLoginDrawerOpen" [selectedUserId]="selectedUserId" (close)="closeLoginDrawer()"
        (userSelected)="onUserSelected($event)">
    </app-drawer-login>

    <!-- Tenant Selection Drawer -->
    <app-drawer-tenant-selection [isOpen]="isTenantDrawerOpen" [organizations]="availableTenants"
        [selectedTenantId]="currentSelectedTenantId" [roles]="roles" (close)="closeTenantDrawer()"
        (organizationSelected)="onTenancyOrganizationSelected($event)">
    </app-drawer-tenant-selection>

    <!-- Player/Context User Selection Drawer -->
    <app-drawer-context-user-selection [isOpen]="isPlayerSelectionDrawerOpen" [loggedInUser]="loggedInUser"
        [availableUsers]="availableContextUsers"
        [selectedUserId]="selectedContextUser?.UserId ?? loggedInUser?.UserId ?? null"
        [canSelectSelf]="canSelectSelfAsContext" (close)="closePlayerSelectionDrawer()"
        (userSelected)="onPlayerSelected($event)">
    </app-drawer-context-user-selection>

    <!-- Teams Drawer -->
    <app-drawer-teams [isOpen]="isTeamsDrawerOpen" [teams]="teams" [staffTeams]="staffTeams"
        [selectedTeam]="selectedTeam" [tenantLogoUrl]="selectedTenant?.LogoUrl || ''"
        [tenantName]="selectedTenant?.TenantName || ''" (close)="closeTeamsDrawer()"
        (selectTeam)="onSelectTeamFromDrawer($event)" (addTeam)="onAddTeam()" (editTeam)="onEditTeam()"
        (deleteTeam)="onDeleteTeam()" (editPlayer)="openPlayerEditPopup($event)" (addPlayer)="openAddPlayerPopup()">
    </app-drawer-teams>

    <!-- Team Groups Drawer -->
    <app-drawer-team-groups [isOpen]="isTeamGroupsDrawerOpen" [teamGroups]="teamGroups"
        [selectedTeamGroup]="selectedTeamGroup" (close)="closeTeamGroupsDrawer()"
        (selectTeamGroup)="onSelectTeamGroupFromDrawer($event)" (createTeamGroup)="onCreateTeamGroup()"
        (editTeamGroup)="onEditTeamGroup()" (deleteTeamGroup)="onDeleteTeamGroup()"
        (importDefaultTeamGroups)="onImportDefaultTeamGroups()">
    </app-drawer-team-groups>

    <!-- Datasets Drawer -->
    <app-drawer-datasets [isOpen]="isDatasetsDrawerOpen" [decisionFlows]="decisionFlows" [teams]="teams"
        [teamGroups]="teamGroups" [selectedOrganizationId]="currentSelectedTenantId"
        [selectedTeamId]="currentSelectedTeamId" [currentTeamGroupId]="currentSelectedTeamGroupId"
        (close)="closeDatasetsDrawer()" (promoteDataset)="onPromoteDataset()" (demoteDataset)="onDemoteDataset()"
        (createDataset)="onCreateNewChart()" (combineDatasets)="onCombineDatasets()"
        (deleteDataset)="onDeleteDataset()">
    </app-drawer-datasets>

    <!-- Lesson Selector Drawer -->
    <app-drawer-lesson-selector [isOpen]="isLessonBuilderDrawerOpen" [loggedInUser]="loggedInUser"
        [selectedTenantId]="currentSelectedTenantId" [selectedTeamId]="currentSelectedTeamId"
        [currentTeamGroupId]="currentSelectedTeamGroupId" [teams]="teams" [teamGroups]="teamGroups"
        [autopilotRunning]="autopilotRunning" (close)="closeLessonBuilderDrawer()" (createLesson)="createLesson()"
        (editLesson)="editLesson()" (runLesson)="runLesson()" (autopilot)="autopilot()" (deleteLesson)="deleteLesson()"
        (promoteLesson)="promoteLesson()" (demoteLesson)="demoteLesson()">
    </app-drawer-lesson-selector>

    <!-- Subscription Drawer -->
    <app-drawer-subscription [isOpen]="isSubscriptionDrawerOpen" [subscription]="selectedTenant?.Subscription"
        (close)="closeSubscriptionDrawer()">
    </app-drawer-subscription>

    <!-- Assigned Lessons Drawer -->
    <app-drawer-assigned-lessons [isOpen]="isAssignedLessonsDrawerOpen" (close)="closeAssignedLessonsDrawer()">
    </app-drawer-assigned-lessons>

    <!-- Context Drawer -->
    <app-drawer-context [isOpen]="isContextDrawerOpen" (close)="closeContextDrawer()">
    </app-drawer-context>

    <!-- To-Do List Drawer -->
    <app-drawer-to-do [isOpen]="isToDoDrawerOpen" (close)="closeToDoDrawer()">
    </app-drawer-to-do>

    <!-- Message Dialog -->
    <app-dialog-message [visible]="showMessageDialog" [title]="messageDialogTitle" [message]="messageDialogMessage"
        [icon]="messageDialogIcon" (close)="showMessageDialog = false">
    </app-dialog-message>
</div>
