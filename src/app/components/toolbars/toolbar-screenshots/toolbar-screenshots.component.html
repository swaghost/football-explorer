<!-- Screenshots Toolbar (Using Base Draggable Toolbar) -->
<div [ngClass]="getToolbarClasses()" [ngStyle]="getToolbarStyles()" *ngIf="visible" [attr.data-toolbar-type]="toolbarId"
    class="screenshots-panel">

    <!-- Toolbar Header (from BaseToolbarComponent) -->
    <div [ngClass]="getHeaderClasses()" (mousedown)="onDragStart($event)">
        <h3>
            <span class="toolbar-icon">{{ toolbarIcon }}</span>
            {{ toolbarTitle }}
        </h3>
        <div class="header-actions">
            <button class="help-toggle" (click)="onToggleHelp()" title="Show help">
                ❓
            </button>
            <button class="expand-toggle" (click)="onToggleExpanded()" [title]="getExpandButtonTitle()">
                {{ expanded ? '🔼' : '🔽' }}
            </button>
            <button class="close-button" (click)="onClose()" title="Close toolbar">
                ✖️
            </button>
            <button class="lock-toggle" (click)="onToggleLock()" [title]="getLockButtonTitle()">
                {{ locked ? '🔒' : '🔓' }}
            </button>
            <span class="drag-icon" (mousedown)="onDragStart($event)">⋮⋮</span>
        </div>
    </div>

    <!-- Help Overlay -->
    <div class="help-overlay" *ngIf="showHelpOverlay" (click)="onCloseHelp()">
        <button class="help-close" (click)="onCloseHelp()" title="Close help">✖️</button>
        <div class="help-content" (click)="$event.stopPropagation()">
            <p [innerHTML]="toolbarHelp"></p>
        </div>
    </div>

    <!-- Toolbar Content -->
    <div class="panel-content" *ngIf="expanded">
        <div class="screenshot-section">
            <h4>Format</h4>
            <div class="screenshot-controls">
                <div class="format-buttons">
                    <button [class.active]="screenshotFormat === 'png'" (click)="onSetScreenshotFormat('png')"
                        title="PNG Format">
                        PNG
                    </button>
                    <button [class.active]="screenshotFormat === 'jpg'" (click)="onSetScreenshotFormat('jpg')"
                        title="JPG Format">
                        JPG
                    </button>
                </div>
            </div>
        </div>

        <div class="screenshot-section">
            <h4>Target</h4>
            <div class="screenshot-controls">
                <div class="target-buttons">
                    <button [class.active]="screenshotTarget === 'clipboard'"
                        (click)="onSetScreenshotTarget('clipboard')" title="Copy to Clipboard">
                        📋 Clipboard
                    </button>
                    <button [class.active]="screenshotTarget === 'download'" (click)="onSetScreenshotTarget('download')"
                        title="Download File">
                        💾 Download
                    </button>
                </div>
            </div>
        </div>

        <div class="screenshot-section">
            <h4>Capture</h4>
            <div class="screenshot-controls">
                <div class="capture-buttons">
                    <button class="screenshot-button" (click)="onTakeScreenshot()" title="Take Screenshot">
                        📷 Capture
                    </button>
                    <button class="snagit-button" [class.active]="snagitMode" (click)="onToggleSnagit()"
                        title="Snag-it: Drag to capture area">
                        ✂️ Snag-it
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Vertical Resize Handle (from BaseToolbarComponent) -->
    <div class="resize-handle" *ngIf="resizable" (mousedown)="onResizeStart($event)" title="Drag to resize vertically">
        <div class="resize-grip"></div>
    </div>
</div>
