<!-- Search Panel (Draggable) -->
<div [ngClass]="getToolbarClasses()" [ngStyle]="getToolbarStyles()" *ngIf="visible" [attr.data-toolbar-type]="toolbarId"
    class="search-panel">
    <div [ngClass]="getHeaderClasses()" (mousedown)="onDragStart($event)">
        <h3>
            <span class="toolbar-icon">{{ toolbarIcon }}</span>
            {{ toolbarTitle }}
        </h3>
        <div class="header-actions">
            <button class="help-toggle" (click)="onToggleHelp()" title="Show help">
                ❓
            </button>
            <button class="expand-toggle" (click)="onToggleExpanded()" [title]="getExpandButtonTitle()">
                {{ expanded ? '🔼' : '🔽' }}
            </button>
            <button class="close-button" (click)="onClose()" title="Close toolbar">
                ✖️
            </button>
            <button class="lock-toggle" (click)="onToggleLock()" [title]="getLockButtonTitle()">
                {{ locked ? '🔒' : '🔓' }}
            </button>
            <span class="drag-icon" (mousedown)="onDragStart($event)">⋮⋮</span>
        </div>
    </div>

    <!-- Help Overlay -->
    <div class="help-overlay" *ngIf="showHelpOverlay" (click)="onCloseHelp()"><button class="help-close"
            (click)="onCloseHelp()" title="Close help">✖️</button>
        <div class="help-content" (click)="$event.stopPropagation()">
            <p [innerHTML]="toolbarHelp"></p>
        </div>
    </div>

    <div class="panel-content" *ngIf="expanded">
        <!-- Search Inputs Section -->
        <div class="search-inputs">
            <div class="search-row">
                <input id="searchInput" type="text" [(ngModel)]="searchTerm" placeholder="Search by ID or name"
                    class="search-input" (keyup.enter)="performSearch()" />
                <button class="clear-btn" (click)="clearSearch()" [disabled]="!searchTerm" title="Clear search">
                    ✖️
                </button>
                <button class="search-btn" (click)="performSearch()" [disabled]="!searchTerm" title="Search">
                    🔍
                </button>
            </div>
        </div>

        <!-- Search Results Section -->
        <!-- Search Results -->
        <div class="search-results" *ngIf="searchPerformed">
            <h4>Search Results ({{ searchResults.length }})</h4>
            <div class="results-list">
                <!-- Use shared node list item component -->
                <app-node-list-item *ngFor="let result of searchResults" [node]="toNodeListItem(result)"
                    [selectedNode]="selectedNode" [showMatchType]="true" (nodeClick)="onNodeItemClick($event)"
                    title="Click to select and pan to node, Shift+Click to add to selection">
                </app-node-list-item>
                <div *ngIf="searchResults.length === 0" class="no-results">
                    No results found
                </div>
            </div>
        </div>
    </div>
    <!-- Footer with search results count -->
    <div class="panel-footer" *ngIf="expanded">
        <div class="footer-stats">
            <span class="stat-item" *ngIf="searchPerformed">
                Results: <strong>{{ searchResults.length }}</strong>
            </span>
            <span class="stat-item" *ngIf="!searchPerformed">
                Ready to search
            </span>
        </div>
    </div>
</div>
